name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  phpcs:
    name: PHP Code Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer, cs2pr

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress

      - name: Run PHPCS
        run: vendor/bin/phpcs --standard=WordPress --extensions=php --report=checkstyle includes/ modules/ admin/ integrations/ tr-wordpress-ai-toolkit.php uninstall.php | cs2pr

  phpunit:
    name: PHPUnit Tests (WP ${{ matrix.wordpress }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3' ]
        wordpress: [ '6.9', 'latest' ]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer, wp-cli
          extensions: mysqli

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress

      - name: Install WordPress test suite
        run: |
          bash tests/bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 ${{ matrix.wordpress }}

      - name: Run PHPUnit
        run: vendor/bin/phpunit --configuration phpunit.xml

  compatibility:
    name: PHP Compatibility Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress

      - name: Check PHP compatibility
        run: vendor/bin/phpcs --standard=PHPCompatibilityWP --runtime-set testVersion 8.1- --extensions=php includes/ modules/ admin/ integrations/ tr-wordpress-ai-toolkit.php

  release:
    name: Build Release ZIP
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ phpcs, phpunit ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer

      - name: Install production dependencies only
        run: composer install --no-dev --no-interaction --optimize-autoloader

      - name: Build ZIP
        run: |
          mkdir -p build
          zip -r build/tr-wordpress-ai-toolkit.zip . \
            --exclude="*.git*" \
            --exclude="tests/*" \
            --exclude="build/*" \
            --exclude="vendor/*/test*" \
            --exclude="*.md" \
            --exclude="composer.*" \
            --exclude="phpunit.xml" \
            --exclude=".github/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/tr-wordpress-ai-toolkit.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
